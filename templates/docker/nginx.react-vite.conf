# nginx configuration for a React + Vite single-page application, including
# PWA assets.
#
# For use with nginxinc/nginx-unprivileged, which runs as uid 101 and expects
# to listen above port 1024.
#
# Implements: docs/06-container/docker-standard.md

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Health endpoint. Status only — no version, no dependency detail, no
    # internal hostnames. See docs/08-observability/.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime configuration must never be cached, or a promoted container
    # serves the previous environment's configuration from a stale cache.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # --- PWA -------------------------------------------------------------
    # The service worker MUST NOT be cached. A cached service worker keeps
    # serving the previous release's assets indefinitely — users stay on old
    # code after a deployment, and no amount of redeploying fixes it because
    # their browser never asks for the new worker.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type "application/manifest+json";
    }

    # Vite emits fingerprinted filenames under /assets, so they are immutable
    # and safe to cache for a long time.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html is NOT cached, or clients keep loading the previous release.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # SPA routing: unmatched paths fall through to the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ADJUST: tighten to the application's actual requirements. A
    # Content-Security-Policy that is too permissive provides little; one
    # that is too strict breaks the application silently in the browser.
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-Frame-Options        "DENY"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/manifest+json image/svg+xml;
}
