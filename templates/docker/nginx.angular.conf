# nginx configuration for an Angular single-page application.
#
# For use with nginxinc/nginx-unprivileged, which runs as uid 101 and expects
# to listen above port 1024.
#
# Implements: docs/06-container/docker-standard.md

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version.
    server_tokens off;

    # Health endpoint. Returns status only — no version, no dependency
    # detail, no internal hostnames. See docs/08-observability/.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime configuration must never be cached, or a promoted container
    # will serve the previous environment's configuration from a stale cache.
    location = /assets/config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # Fingerprinted build output is immutable and safe to cache for a long
    # time. index.html is not, or clients keep loading the previous release.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # SPA routing: unmatched paths fall through to the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ADJUST: tighten to your application's actual requirements. A
    # Content-Security-Policy that is too permissive provides little; one
    # that is too strict breaks the application silently in the browser.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;
}
