# DEV deployment.
#
# Implements: docs/06-container/docker-compose-standard.md
#
# Copy to deployment/dev/compose.yml and adjust the marked values.
#
# DEV may relax the PROD-only requirements: resource limits and log rotation
# are omitted here, and diagnostic settings are enabled.
#
# What DEV does NOT relax:
#   - The image is still pulled from Harbor by explicit tag. No `build:`,
#     because a locally built image is not the artifact that gets promoted.
#   - Credentials are DEV-specific and grant nothing in UAT or PROD. DEV has
#     the widest access and the weakest controls, which makes it the natural
#     pivot point for an attacker.
#   - No production data.

name: myapp-dev

services:

  web:
    image: ${HARBOR_URL:?HARBOR_URL is required}/${HARBOR_PROJECT:?HARBOR_PROJECT is required}/web:${WEB_VERSION:?WEB_VERSION is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
      ENVIRONMENT: dev
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

  api:
    image: ${HARBOR_URL:?HARBOR_URL is required}/${HARBOR_PROJECT:?HARBOR_PROJECT is required}/api:${API_VERSION:?API_VERSION is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING is required}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      # Verbose logging and diagnostic endpoints are acceptable in DEV and
      # must not be enabled elsewhere.
      Serilog__MinimumLevel__Default: Debug
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    networks:
      - frontend
      - backend
    volumes:
      - api-dataprotection:/home/appuser/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s

  worker:
    image: ${HARBOR_URL:?HARBOR_URL is required}/${HARBOR_PROJECT:?HARBOR_PROJECT is required}/worker:${WORKER_VERSION:?WORKER_VERSION is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING is required}
      WORKER_LIVENESS_FILE: /var/run/worker/alive
      WORKER_LIVENESS_MAX_AGE_SECONDS: "120"
    networks:
      - backend
    stop_grace_period: 60s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  api-dataprotection:
