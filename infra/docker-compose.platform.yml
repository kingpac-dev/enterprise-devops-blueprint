# ==============================================================================
# Enterprise DevOps Blueprint — Core Platform Stack
# Includes: Jenkins Controller, SonarQube LTS + PostgreSQL, Portainer CE
# Implements: docs/01-architecture/enterprise-devops-architecture.md
#             docs/02-infrastructure/platform-installation-strategy.md
# ==============================================================================

name: devops-platform-core

services:

  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database for SonarQube
  # ----------------------------------------------------------------------------
  sonarqube-db:
    image: ${SONAR_DB_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. SonarQube Server
  # ----------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-10.4.1-community}
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - platform-net
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 3072M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Jenkins Controller
  # ----------------------------------------------------------------------------
  jenkins:
    build:
      context: ./configs/jenkins
      dockerfile: Dockerfile
    image: enterprise-devops/jenkins:${JENKINS_VERSION:-2.440.3-lts-jdk17}
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?JENKINS_ADMIN_PASSWORD is required}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-devops.local}
      HARBOR_ROBOT_USER: ${HARBOR_ROBOT_USER:-robot$$jenkins-ci}
      HARBOR_ROBOT_SECRET: ${HARBOR_ROBOT_SECRET:-}
      SONAR_AUTH_TOKEN: ${SONAR_AUTH_TOKEN:-}
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./configs/jenkins/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-net
    expose:
      - "8080"
      - "50000"
    ports:
      # Optional: Direct agent connection port
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/login > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 3072M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Portainer CE (GitOps Deployment Engine & Operational Visibility)
  # ----------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.20.1}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - platform-net
    expose:
      - "9000"
      - "9443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/api/status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  platform-net:
    name: devops-platform-net
    driver: bridge
    ipam:
      config:
        - subnet: ${TOOLCHAIN_NETWORK_SUBNET:-10.200.2.0/24}

volumes:
  sonarqube_pgdata:
    name: devops_sonarqube_pgdata
  sonarqube_data:
    name: devops_sonarqube_data
  sonarqube_extensions:
    name: devops_sonarqube_extensions
  sonarqube_logs:
    name: devops_sonarqube_logs
  jenkins_data:
    name: devops_jenkins_data
  portainer_data:
    name: devops_portainer_data
