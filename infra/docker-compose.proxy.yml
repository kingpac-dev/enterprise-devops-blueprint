# ==============================================================================
# Enterprise DevOps Blueprint — TLS Reverse Proxy / Gateway
# Includes: High-performance Nginx routing for Jenkins, SonarQube, Portainer, Grafana
# Implements: docs/03-network/network-security-baseline.md
# ==============================================================================

name: devops-platform-proxy

services:
  nginx-proxy:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  platform-net:
    name: devops-platform-net
    external: true

volumes:
  nginx_logs:
    name: devops_nginx_logs
