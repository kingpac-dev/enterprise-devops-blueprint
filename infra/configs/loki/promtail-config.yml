# ==============================================================================
# Enterprise DevOps Blueprint — Promtail Configuration
# Implements: docs/08-observability/logging-standard.md
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          host: devops-platform
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
