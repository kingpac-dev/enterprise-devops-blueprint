# ==============================================================================
# Enterprise DevOps Blueprint — Prometheus Scrape Configuration
# Implements: docs/08-observability/monitoring-standard.md
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'enterprise-devops-platform'

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: 'platform-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_transmit_bytes_total|container_network_receive_bytes_total|container_fs_usage_bytes)'
        action: keep

  - job_name: 'jenkins'
    metrics_path: '/prometheus/'
    static_configs:
      - targets: ['jenkins:8080']

  - job_name: 'runtime-services'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orders-api:8080']
        labels:
          environment: 'dev'
          service: 'orders-api'
