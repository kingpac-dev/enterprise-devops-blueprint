# ==============================================================================
# Portainer Stack — Observability Suite (Zero-Build Edition)
# Compatibility: Portainer.io CE/EE (Stacks -> Add Stack -> Web Editor / Git)
# Includes: Prometheus, Grafana, Loki, Promtail, cAdvisor, Node Exporter
# Implements: docs/08-observability/observability-standard.md
# ==============================================================================

version: '3.8'

services:

  # ----------------------------------------------------------------------------
  # 1. Prometheus Server (Auto-Configured)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.51.0}
    container_name: devops-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - platform-net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/prometheus.yml
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          - job_name: 'node-exporter'
            static_configs:
              - targets: ['node-exporter:9100']
          - job_name: 'cadvisor'
            static_configs:
              - targets: ['cadvisor:8080']
          - job_name: 'jenkins'
            metrics_path: '/prometheus/'
            static_configs:
              - targets: ['devops-jenkins:8080']
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Grafana Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.4.0}
    container_name: devops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaStrongPass123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - platform-net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat << 'EOF' > /etc/grafana/provisioning/datasources/datasources.yaml
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            jsonData:
              timeInterval: 15s
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: false
        EOF
        exec /run.sh
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Loki Log Aggregator
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-2.9.6}
    container_name: devops-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    networks:
      - platform-net
    ports:
      - "${LOKI_PORT:-3100}:3100"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/loki-config.yaml
        auth_enabled: false
        server:
          http_listen_port: 3100
        common:
          path_prefix: /loki
          storage:
            filesystem:
              chunks_directory: /loki/chunks
              rules_directory: /loki/rules
          replication_factor: 1
          ring:
            instance_addr: 127.0.0.1
            kvstore:
              store: inmemory
        schema_config:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        storage_config:
          tsdb_shipper:
            active_index_directory: /loki/tsdb-index
            cache_location: /loki/tsdb-cache
          filesystem:
            directory: /loki/chunks
        limits_config:
          enforce_metric_name: false
          reject_old_samples: true
          retention_period: 336h
        compactor:
          working_directory: /loki/compactor
          retention_enabled: true
        EOF
        exec /usr/bin/loki -config.file=/tmp/loki-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Promtail Log Collector
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-2.9.6}
    container_name: devops-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/promtail-config.yaml
        server:
          http_listen_port: 9080
          grpc_listen_port: 0
        positions:
          filename: /tmp/positions.yaml
        clients:
          - url: http://loki:3100/loki/api/v1/push
        scrape_configs:
          - job_name: docker-containers
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: containerlogs
                  __path__: /var/lib/docker/containers/*/*-json.log
            pipeline_stages:
              - json:
                  expressions:
                    output: log
                    stream: stream
                    time: time
              - timestamp:
                  source: time
                  format: RFC3339Nano
              - output:
                  source: output
        EOF
        exec /usr/bin/promtail -config.file=/tmp/promtail-config.yaml
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. cAdvisor Container Metrics
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.49.1}
    container_name: devops-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - platform-net
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. Node Exporter Host Metrics
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.7.0}
    container_name: devops-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - platform-net
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  platform-net:
    name: devops-platform-net
    external: true

volumes:
  prometheus_data:
    name: devops_prometheus_data
  grafana_data:
    name: devops_grafana_data
  loki_data:
    name: devops_loki_data
