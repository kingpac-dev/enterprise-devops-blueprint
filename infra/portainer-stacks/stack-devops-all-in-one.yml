# ==============================================================================
# Portainer Stack — Enterprise DevOps Platform (ALL-IN-ONE Zero-Build Edition)
# Compatibility: Portainer.io CE/EE (Stacks -> Add Stack -> Web Editor)
#
# One-click deployment for:
#   - Jenkins Controller (Auto-bootstrapped plugins & JCasC)
#   - SonarQube LTS + PostgreSQL 15
#   - Observability: Prometheus, Grafana, Loki, Promtail, cAdvisor, Node Exporter
#   - Nginx Ingress Gateway
# ==============================================================================

version: '3.8'

services:

  # ============================================================================
  # 1. CI/CD & CODE QUALITY CORE
  # ============================================================================

  sonarqube-db:
    image: postgres:15-alpine
    container_name: devops-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-SonarStrongPass123!}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-10.4.1-community}
    container_name: devops-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-SonarStrongPass123!}
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - platform-net
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 3072M

  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:2.440.3-lts-jdk17}
    container_name: devops-jenkins
    restart: unless-stopped
    user: root
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-JenkinsStrongPass123!}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-devops.local}
      HARBOR_ROBOT_USER: ${HARBOR_ROBOT_USER:-robot$$jenkins-ci}
      HARBOR_ROBOT_SECRET: ${HARBOR_ROBOT_SECRET:-ChangeMeHarborSecret!}
      SONAR_AUTH_TOKEN: ${SONAR_AUTH_TOKEN:-ChangeMeSonarToken!}
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dorg.apache.commons.jelly.tags.core.expr.InstantExpression.CACHE_SIZE=1000"
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/jenkins.yaml"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-net
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /var/jenkins_home/casc_configs
        cat << 'EOF' > /var/jenkins_home/casc_configs/jenkins.yaml
        jenkins:
          systemMessage: "Enterprise DevOps Blueprint — Portainer All-in-One"
          numExecutors: 2
          mode: NORMAL
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "$${JENKINS_ADMIN_USER}"
                  password: "$${JENKINS_ADMIN_PASSWORD}"
          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false
          crumbIssuer:
            standard:
              excludeClientIPFromCrumb: false
          remotingSecurity:
            enabled: true
        unclassified:
          location:
            url: "http://$${PLATFORM_DOMAIN}:8080/"
            adminAddress: "admin@$${PLATFORM_DOMAIN}"
          sonarGlobalConfiguration:
            buildWrapperEnabled: true
            installations:
              - name: "SonarQube"
                serverUrl: "http://sonarqube:9000"
                credentialsId: "sonarqube-token"
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "harbor-robot-creds"
                      username: "$${HARBOR_ROBOT_USER}"
                      password: "$${HARBOR_ROBOT_SECRET}"
                      description: "Harbor Registry Credentials"
                  - string:
                      scope: GLOBAL
                      id: "sonarqube-token"
                      secret: "$${SONAR_AUTH_TOKEN}"
                      description: "SonarQube Auth Token"
        EOF

        if [ ! -f /var/jenkins_home/.plugins_installed ]; then
          echo "[INFO] Installing essential CI/CD plugins..."
          jenkins-plugin-cli --plugins \
            configuration-as-code:1775.v810dc950b_514 \
            git:5.2.1 \
            workflow-aggregator:596.v8c21c963d92d \
            pipeline-stage-view:2.34 \
            sonar:2.16.1 \
            docker-workflow:572.v950f58993843 \
            credentials-binding:681.vf91662a_32536 \
            timestamper:1.26 \
            prometheus:2.2.0 \
            matrix-auth:3.2.2 || true
          touch /var/jenkins_home/.plugins_installed
        fi
        exec /usr/bin/tini -s -- /usr/local/bin/jenkins.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/login > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3072M

  # ============================================================================
  # 2. OBSERVABILITY SUITE
  # ============================================================================

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.51.0}
    container_name: devops-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - platform-net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/prometheus.yml
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          - job_name: 'node-exporter'
            static_configs:
              - targets: ['node-exporter:9100']
          - job_name: 'cadvisor'
            static_configs:
              - targets: ['cadvisor:8080']
          - job_name: 'jenkins'
            metrics_path: '/prometheus/'
            static_configs:
              - targets: ['jenkins:8080']
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2048M

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.4.0}
    container_name: devops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaStrongPass123!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - platform-net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat << 'EOF' > /etc/grafana/provisioning/datasources/datasources.yaml
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: false
        EOF
        exec /run.sh
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  loki:
    image: grafana/loki:${LOKI_VERSION:-2.9.6}
    container_name: devops-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    networks:
      - platform-net
    ports:
      - "${LOKI_PORT:-3100}:3100"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/loki-config.yaml
        auth_enabled: false
        server:
          http_listen_port: 3100
        common:
          path_prefix: /loki
          storage:
            filesystem:
              chunks_directory: /loki/chunks
              rules_directory: /loki/rules
          replication_factor: 1
          ring:
            instance_addr: 127.0.0.1
            kvstore:
              store: inmemory
        schema_config:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        storage_config:
          tsdb_shipper:
            active_index_directory: /loki/tsdb-index
            cache_location: /loki/tsdb-cache
          filesystem:
            directory: /loki/chunks
        limits_config:
          enforce_metric_name: false
          reject_old_samples: true
          retention_period: 336h
        EOF
        exec /usr/bin/loki -config.file=/tmp/loki-config.yaml
    deploy:
      resources:
        limits:
          memory: 1536M

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-2.9.6}
    container_name: devops-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/promtail-config.yaml
        server:
          http_listen_port: 9080
          grpc_listen_port: 0
        positions:
          filename: /tmp/positions.yaml
        clients:
          - url: http://loki:3100/loki/api/v1/push
        scrape_configs:
          - job_name: docker-containers
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: containerlogs
                  __path__: /var/lib/docker/containers/*/*-json.log
            pipeline_stages:
              - json:
                  expressions:
                    output: log
                    stream: stream
                    time: time
              - timestamp:
                  source: time
                  format: RFC3339Nano
              - output:
                  source: output
        EOF
        exec /usr/bin/promtail -config.file=/tmp/promtail-config.yaml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.49.1}
    container_name: devops-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - platform-net
    ports:
      - "${CADVISOR_PORT:-8082}:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.7.0}
    container_name: devops-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - platform-net
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================================================
  # 3. GATEWAY / REVERSE PROXY
  # ============================================================================

  gateway:
    image: nginx:1.25-alpine
    container_name: devops-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - platform-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name _;
            client_max_body_size 2048M;

            location /healthz {
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }

            location /jenkins/ {
                proxy_pass http://jenkins:8080/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            location /sonar/ {
                proxy_pass http://sonarqube:9000/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }

            location /grafana/ {
                proxy_pass http://grafana:3000/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }

            location / {
                return 200 "Enterprise DevOps Platform (Portainer Stack)\nServices available:\n - /jenkins/\n - /sonar/\n - /grafana/\nDirect Ports:\n - Jenkins: :8080\n - SonarQube: :9000\n - Grafana: :3000\n - Prometheus: :9090\n";
                add_header Content-Type text/plain;
            }
        }
        EOF
        exec nginx -g "daemon off;"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  platform-net:
    name: devops-platform-net
    driver: bridge

volumes:
  sonarqube_pgdata:
    name: devops_sonarqube_pgdata
  sonarqube_data:
    name: devops_sonarqube_data
  sonarqube_extensions:
    name: devops_sonarqube_extensions
  sonarqube_logs:
    name: devops_sonarqube_logs
  jenkins_data:
    name: devops_jenkins_data
  prometheus_data:
    name: devops_prometheus_data
  grafana_data:
    name: devops_grafana_data
  loki_data:
    name: devops_loki_data
